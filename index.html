<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="content">
          <img src="assets\images\illustration-article.svg" alt="illustration-article" />

          <div class="yellow-box">
            <div class="yellow-box-content text-preset-3">Learning</div>
          </div>

          <p class="text-preset-3">Published 21 Dec 2023</p>

          <h1>HTML & CSS foundations</h1>
          <p class="paragraph">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
          <div class="author">
            <img src="./assets/images/image-avatar.webp " />
            <p class="text-preset-3-bold">Greg Hooper</p>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Yahia Mohammed Abdelrahman</a>.
      </div>
    </footer>
  </body>
</html>
